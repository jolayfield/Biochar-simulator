name: CI

# The `pull_request` trigger deliberately carries NO branch filter. With
# `branches: [main]` a PR based on any other branch matches nothing, runs zero
# checks, and still reports MERGEABLE / CLEAN -- a green-looking PR that was
# never tested. That happened twice in one session (#21 on #20, #23 on #21);
# see docs/solutions/workflow-issues/stacked-pr-ci-and-base-branch-traps.md.
# Do not add a filter back.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint. Seconds, and independent of the test matrix so a style finding is
  # never confused with a broken build.
  #
  # The ruleset in pyproject.toml is deliberately narrow (E + F, several
  # ignored). A linter switched on at full strength against a codebase that has
  # never been linted produces hundreds of findings and gets disabled within a
  # week. Its first run on this repo found a genuine bug -- examples/
  # example_usage.py called Path() without importing it, so the example crashed
  # with NameError before running anything.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check .

  # Install from conda-forge, the path README.md and CLAUDE.md tell users to
  # take. It had never been exercised: every leg above installs from PyPI, so a
  # conda-only packaging break would have reached users with CI fully green.
  #
  # Deliberately smoke-only -- it verifies the package imports and the console
  # entry points resolve. The behavioural suite is the matrix's job.
  conda:
    name: conda-forge install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: biochar-ci
          environment-file: devtools/conda-envs/test_env.yaml
          auto-activate-base: false
      - name: Install the package into the conda env
        shell: bash -el {0}
        run: pip install -e . --no-deps
      - name: Smoke test
        shell: bash -el {0}
        run: |
          python -c "import biochar; print('biochar', biochar.__version__)"
          biochar-gen --help > /dev/null
          biochar-sweep --help > /dev/null
          biochar-md-setup --help > /dev/null
          biochar-condense --help > /dev/null
          echo "all four console entry points resolve"

  # Requirements traceability. Runs in seconds and is independent of the test
  # matrix, so it reports separately rather than gating on Python version.
  #
  # Three things are enforced here, each catching a different failure:
  #
  #   index  -- exits non-zero on duplicate IDs. A duplicate silently merges two
  #             distinct requirements into one registry entry: corruption, not a gap.
  #   check  -- exits non-zero on a stale reference, i.e. a test citing an rq- ID
  #             that no longer exists. No longer suppressed with `|| true`.
  #   scenarios covered -- every `type: scenario` entry has at least one test.
  #
  # The last one is scoped to scenarios on purpose. `rq check` also warns about
  # unreferenced `section` and `file` entries, but those are document headings
  # ("## Layering", "## Public surface") that no test could reasonably cite --
  # roughly 30 of them at present. Failing on the raw warning count would fail
  # every run forever, so the gate reads the registry directly instead.
  rqm:
    name: Requirements traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rqm.sh needs bash >= 4 (associative arrays) and jq. ubuntu-latest has
      # both; this asserts it rather than discovering it mid-run.
      - name: Check tooling
        run: |
          bash --version | head -1
          jq --version
          [ "${BASH_VERSINFO[0]}" -ge 4 ] || { echo "::error::bash >= 4 required"; exit 1; }
        shell: bash

      # Rebuilds the registry from scratch and fails on duplicate IDs.
      - name: Rebuild the requirements registry
        run: bash tools/rqm/rq index

      # The registry is committed, so a rebuild that changes it means someone
      # edited rqm/ without re-indexing. Left as a warning rather than an error
      # because the diff is regenerable, but it should not go unnoticed.
      - name: Warn if the committed registry is stale
        run: |
          if ! git diff --quiet rqm/registry.json; then
            echo "::warning::rqm/registry.json is stale -- run 'bash tools/rqm/rq index' and commit"
            git diff --stat rqm/registry.json
          fi

      # Stale references are errors in rqm.sh itself, so this is a hard failure.
      - name: Check traceability
        run: bash tools/rqm/rq check

      # Every promise the requirements make must have a test that claims to
      # defend it. A scenario landing without one is the gap this whole system
      # exists to surface, so it blocks the PR rather than warning.
      - name: Every scenario has a defending test
        run: |
          unref=$(jq -r '.[] | select(.type=="scenario" and (.refs|length)==0)
                          | "\(.file): \(.title)"' rqm/registry.json)
          if [ -n "$unref" ]; then
            echo "::error::scenarios with no defending test:"
            printf '%s\n' "$unref"
            echo "Add a '# rq-xxxxxxxx' comment to the test that defends each," \
                 "then run 'bash tools/rqm/rq index'."
            exit 1
          fi
          echo "all scenarios have a defending test"

      - name: Summarise coverage
        run: |
          total=$(jq '[.[] | select(.type=="scenario")] | length' rqm/registry.json)
          covered=$(jq '[.[] | select(.type=="scenario" and (.refs|length)>0)] | length' rqm/registry.json)
          echo "### Requirements traceability" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$covered of $total scenarios have a defending test." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Unreferenced scenarios:" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | select(.type=="scenario" and (.refs|length)==0) | "- \(.file): \(.title)"' \
            rqm/registry.json >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # tests/test_opls_type_map.py resolves the forcefield from GMXDATA. Without
    # it those tests skip and the suite reports green having checked nothing.
    env:
      GMXDATA: /usr/share/gromacs
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installs through pyproject.toml so the declared dependency floors
      # (numpy>=1.24, rdkit>=2023.9.1, scipy>=1.10, networkx>=3.1) are actually
      # resolved. The previous hand-written `pip install rdkit networkx ...`
      # followed by `--no-deps` meant those floors were never exercised: a bad
      # floor would have shipped with CI green.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      # The full gromacs package, not just gromacs-data. Most forcefield-backed
      # tests only parse oplsaa.ff and would be satisfied by the data package,
      # but tests/test_grompp_smoke.py runs `gmx grompp` on an exported topology
      # and reads the .tpr back. That is the only check that sees a term the
      # topology fails to emit at all -- the missing [ pairs ] section and the
      # missing impropers both passed every table-based check for as long as
      # they existed. gromacs pulls gromacs-data in as a dependency.
      - name: Install GROMACS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gromacs

      # Without this the suite still passes -- it just skips the forcefield and
      # grompp tests and reports green having verified nothing. That silent skip
      # is the exact failure mode these tests exist to catch, so assert both the
      # data and the binary are really there rather than trusting apt.
      - name: Verify the forcefield and gmx are discoverable
        run: |
          if [ ! -f "$GMXDATA/top/oplsaa.ff/atomtypes.atp" ]; then
            echo "::error::oplsaa.ff not found under $GMXDATA — the forcefield tests would silently skip"
            find / -name atomtypes.atp -not -path '*/node_modules/*' 2>/dev/null | head
            exit 1
          fi
          echo "forcefield OK: $(ls "$GMXDATA/top/oplsaa.ff" | wc -l) files"
          if ! command -v gmx > /dev/null; then
            echo "::error::gmx not on PATH — tests/test_grompp_smoke.py would silently skip"
            exit 1
          fi
          gmx --version | grep -E "GROMACS version"

      # -n auto: the suite is CPU-bound and the legs were taking ~40 min each.
      # Coverage needs --cov-context or it under-reports under xdist, so
      # pytest-cov's xdist integration is used as-is (it combines worker data).
      #
      # Runs the FULL suite including -m slow. The slow marker exists to keep
      # the pre-commit hook fast, not to hide tests from CI.
      - name: Run tests
        run: pytest tests/ -n auto --tb=short -rs -q --cov=biochar --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
