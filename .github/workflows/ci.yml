name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Requirements traceability. Runs in seconds and is independent of the test
  # matrix, so it reports separately rather than gating on Python version.
  #
  # Deliberately warn-only for now: `rq check` reports every specified
  # requirement that no test references, and 16 of them currently have no
  # defending test. Those are real coverage gaps being closed incrementally,
  # not failures to block a PR on. What IS enforced here is `index`, which
  # exits non-zero on duplicate IDs -- a duplicate silently merges two distinct
  # requirements into one registry entry, which is corruption rather than a gap.
  #
  # Promote `check` to a hard failure once the unreferenced count reaches zero.
  rqm:
    name: Requirements traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rqm.sh needs bash >= 4 (associative arrays) and jq. ubuntu-latest has
      # both; this asserts it rather than discovering it mid-run.
      - name: Check tooling
        run: |
          bash --version | head -1
          jq --version
          [ "${BASH_VERSINFO[0]}" -ge 4 ] || { echo "::error::bash >= 4 required"; exit 1; }
        shell: bash

      # Rebuilds the registry from scratch and fails on duplicate IDs.
      - name: Rebuild the requirements registry
        run: bash tools/rqm/rq index

      # The registry is committed, so a rebuild that changes it means someone
      # edited rqm/ without re-indexing. Left as a warning rather than an error
      # because the diff is regenerable, but it should not go unnoticed.
      - name: Warn if the committed registry is stale
        run: |
          if ! git diff --quiet rqm/registry.json; then
            echo "::warning::rqm/registry.json is stale -- run 'bash tools/rqm/rq index' and commit"
            git diff --stat rqm/registry.json
          fi

      - name: Check traceability
        run: bash tools/rqm/rq check || true

      - name: Summarise coverage
        run: |
          total=$(jq '[.[] | select(.type=="scenario")] | length' rqm/registry.json)
          covered=$(jq '[.[] | select(.type=="scenario" and (.refs|length)>0)] | length' rqm/registry.json)
          echo "### Requirements traceability" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$covered of $total scenarios have a defending test." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Unreferenced scenarios:" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | select(.type=="scenario" and (.refs|length)==0) | "- \(.file): \(.title)"' \
            rqm/registry.json >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # tests/test_opls_type_map.py resolves the forcefield from GMXDATA. Without
    # it those tests skip and the suite reports green having checked nothing.
    env:
      GMXDATA: /usr/share/gromacs
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install rdkit networkx numpy scipy scikit-learn
          pip install pytest pytest-cov
          pip install -e . --no-deps

      # The forcefield-backed tests only parse oplsaa.ff (atomtypes.atp,
      # ffnonbonded.itp, ffbonded.itp) -- they never invoke gmx. gromacs-data
      # ships exactly those files without the binaries.
      - name: Install GROMACS forcefield data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gromacs-data

      # Without this the suite still passes -- it just skips every
      # forcefield-backed test and reports green having verified nothing. That
      # silent skip is the exact failure mode these tests exist to catch, so
      # assert the forcefield is really discoverable rather than trusting apt.
      - name: Verify the forcefield is discoverable
        run: |
          if [ ! -f "$GMXDATA/top/oplsaa.ff/atomtypes.atp" ]; then
            echo "::error::oplsaa.ff not found under $GMXDATA — the forcefield tests would silently skip"
            find / -name atomtypes.atp -not -path '*/node_modules/*' 2>/dev/null | head
            exit 1
          fi
          echo "forcefield OK: $(ls "$GMXDATA/top/oplsaa.ff" | wc -l) files"

      - name: Run tests
        run: pytest tests/ -v --tb=short -rs --cov=biochar --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
