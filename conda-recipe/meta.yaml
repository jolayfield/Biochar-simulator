# Tracks the newest version published to PyPI, which is not the same thing as
# the version in pyproject.toml. `version` and `sha256` must move together and
# only after an upload exists: the hash is of the published sdist, so bumping
# the version alone produces a recipe that cannot build.
#
# To bump after a release:
#   curl -s https://pypi.org/pypi/biochar/<version>/json \
#     | python -c "import json,sys; [print(f['digests']['sha256']) \
#         for f in json.load(sys.stdin)['urls'] if f['packagetype']=='sdist']"
{% set version = "0.4.0" %}

package:
  name: biochar
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/b/biochar/biochar-{{ version }}.tar.gz
  sha256: 5b863b4284ce977b3c7557d83b0ae1c174a78d89f46d5cfd5a5a4a59f5d07898

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9
    - setuptools >=68
    - wheel
    - pip
  run:
    - python >=3.9
    - numpy >=1.24.0
    - scipy >=1.10.0
    - networkx >=3.1
    - rdkit >=2023.9.1
  run_constrained:
    # Optional QM charge backend (charge_method="qm", 1.14*CM1A via AM1).
    # Not a hard dependency — install explicitly to enable:
    #   conda install -c conda-forge mopac
    # If present, it must be a recent OpenMOPAC.
    - mopac >=23
    # Optional ML charge refinement (charge_method="ml"), the [ml] extra in
    # pyproject.toml. Same arrangement: not required, but constrained if present.
    - scikit-learn >=1.3

test:
  imports:
    - biochar
  commands:
    - pip check
    # A console script that does not resolve is a packaging failure the import
    # test cannot see, so each one is exercised here as CI does.
    #
    # This list must match the scripts declared by the version above, NOT by the
    # working tree: 0.4.0 ships three, and biochar-condense was added later.
    # Testing a script the packaged version does not declare fails the build.
    - biochar-gen --help
    - biochar-sweep --help
    - biochar-md-setup --help
  requires:
    - pip

about:
  home: https://github.com/jolayfield/Biochar-simulator
  summary: Generate biochar molecular structures for GROMACS MD simulations
  license: MIT
  license_file: LICENSE
  doc_url: https://biochar-simulator.readthedocs.io

extra:
  recipe-maintainers:
    - jolayfield
